<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E88E5"/>
      <stop offset="100%" style="stop-color:#1565C0"/>
    </linearGradient>
  </defs>
  <!-- 圆形背景 -->
  <circle cx="128" cy="128" r="120" fill="url(#bg)"/>
  <!-- 摄像头机身 -->
  <rect x="40" y="80" width="176" height="100" rx="16" fill="white" opacity="0.95"/>
  <!-- 镜头外圈 -->
  <circle cx="128" cy="130" r="40" fill="#1E88E5"/>
  <!-- 镜头内圈 -->
  <circle cx="128" cy="130" r="24" fill="#1565C0"/>
  <!-- 镜头高光 -->
  <circle cx="118" cy="120" r="8" fill="white" opacity="0.4"/>
  <!-- 指示灯 -->
  <circle cx="52" cy="95" r="5" fill="#4CAF50">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <!-- 顶部天线/WiFi -->
  <rect x="148" y="60" width="8" height="24" rx="2" fill="white" opacity="0.8"/>
  <rect x="148" y="56" width="20" height="6" rx="3" fill="white" opacity="0.8"/>
  <!-- 底部文字 -->
  <text x="128" y="210" text-anchor="middle" fill="white" font-size="14" font-family="Arial" opacity="0.8">CAMERA</text>
</svg>